    <title>xingbuild｜作品与实践</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <article>
          <h1>认知企业经营体系</h1>
          <p>用四张相互衔接的架构图，理解企业如何经营、如何设计业务、如何实现企业数字化，以及复杂现实如何被一致表达。</p>
          <section>
            <h2>一家企业如何持续创造价值、形成经营结果并调整自身？</h2>
            <p>外部环境影响经营与架构设计并构成企业现实条件；设计建设企业现实并提出数字化需求；企业运作产生事实与经营结果，支持经营分析与决策，再调整设计和后续运作。</p>
          </section>
          <section>
            <h2>如何把战略和经营目标转化为可执行、可度量的业务设计？</h2>
            <p>需求或事件触发价值流，价值流需要企业能力与资源，并通过业务流程改变业务对象；规则约束执行，事实为指标提供依据，目标差距反馈调整能力、流程和规则。</p>
          </section>
          <section>
            <h2>如何把业务设计转化为真正进入企业运作的产品、数据和系统？</h2>
            <p>企业业务架构提出数字化需求，B 端产品架构与数据架构协同设计并共同驱动技术架构，经工程实现形成进入企业现实的数字化系统；事实支持决策并调整业务架构。</p>
          </section>
          <section>
            <h2>如何避免同一个业务词在不同讨论中混用，失去明确边界？</h2>
            <p>主体、对象、关系、状态、事件、活动与过程、规则、事实、指标和结果通过参与、作用、改变、约束、记录与衡量形成一致的基础表达语法。</p>
          </section>
        </article>
      </main>
    </noscript>
