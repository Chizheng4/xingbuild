        <article>
          <h1>企业经营体系认知框架</h1>
          <p>企业经营体系由企业现实、经营与架构设计、数字化实现和运行反馈四个相互连接的平面组成。</p>
          <ol>
            <li>企业经营体系总览：从整体理解企业现实、设计、实现与反馈。</li>
            <li>数字化实现：企业业务架构提出数字化需求，并进入产品、数据、技术和工程实现。</li>
            <li>企业业务架构：围绕经营目标设计九个固定视角。</li>
            <li>业务对象：企业运作中被创建、使用、改变和持续追踪的对象。</li>
            <li>对象：在现实中被识别、使用、改变或持续追踪的事物。</li>
            <li>Robotaxi 应用：认知框架的场景分析，不代表真实城市经营结果已经验证。</li>
          </ol>
        </article>
      </main>
